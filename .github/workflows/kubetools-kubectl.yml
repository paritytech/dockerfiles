name: kubetools-kubectl

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]    
    paths:
      - 'kubetools-kubectl/*'
      - '.github/workflows/kubetools-kubectl.yml'
  workflow_dispatch:
    inputs:
      kube_version:
        description: 'kubectl version to build. Empty uses KUBE_VERSION. `latest` only moves when building KUBE_VERSION.'
        required: false
        type: string
        default: ''

env: 
  REGISTRY_PATH: 'docker.io/paritytech'
  REGISTRY_PATH_PR: 'docker.io/paritypr'
  IMAGE_NAME: 'kubetools-kubectl'
  KUBE_VERSION: '1.34.12'

jobs:
  Build:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'main' || null }}
    steps: 

    - uses: actions/checkout@v4

    - name: set vars
      id: vars
      run: |
        export COMMIT_SHA=${{ github.sha }}
        echo "IMAGE_DATE_TAG=${COMMIT_SHA:0:8}-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        VERSION='${{ inputs.kube_version }}'
        [ -z "$VERSION" ] && VERSION="${KUBE_VERSION}"
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        if [ "$VERSION" = "${KUBE_VERSION}" ]; then
          echo "TAGS=${VERSION} latest" >> $GITHUB_OUTPUT
        else
          echo "TAGS=${VERSION}" >> $GITHUB_OUTPUT
        fi

    - name: build and push staging
      if: ${{ github.event_name == 'pull_request' }}
      uses: ./.github/actions/build-push-image      
      with:
        registry: ${{ env.REGISTRY_PATH_PR }}
        registry-user: ${{ secrets.REGISTRY_USER }}
        registry-password: ${{ secrets.REGISTRY_PASSWORD }}
        image-name: ${{ env.IMAGE_NAME }}
        image-tags: >
          staging
        build-args: |
          KUBE_VERSION=${{ steps.vars.outputs.VERSION }}

    - name: build and push
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: ./.github/actions/build-push-image      
      with:
        registry: ${{ env.REGISTRY_PATH }}
        registry-user: ${{ secrets.REGISTRY_USER }}
        registry-password: ${{ secrets.REGISTRY_PASSWORD }}
        image-name: ${{ env.IMAGE_NAME }}
        image-tags: ${{ steps.vars.outputs.TAGS }}
        build-args: |
          KUBE_VERSION=${{ steps.vars.outputs.VERSION }}