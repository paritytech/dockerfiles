name: "build and push image"
description: "Build and push an image to a registry"

inputs:
  registry:
    required: true
  registry-user:
    required: false
  registry-password:
    required: false

  context:
    required: false
    default: "./"

  image-name:
    required: true
  # Defaults to ./<image-name>/Dockerfile. Set this when the source directory does not match the
  # repository being pushed to, e.g. ci-unified-bookworm/Dockerfile published as ci-unified.
  containerfile:
    required: false
    default: ""
  image-tags:
    required: true
  build-args:
    required: false
    default: ""
  build-opts:
    required: false
    default: ""

  push:
    required: false
    default: true

runs:
  using: "composite"
  steps:
    - name: set vars
      id: vars
      shell: bash
      run: |
        echo "BUILD_DATE='$(date +%Y%m%d)'" >> $GITHUB_OUTPUT

    - name: Install buildah
      shell: bash
      run: |
        sudo apt-get -y update
        sudo apt-get -y install buildah podman

    - run: mkdir -p /root/.docker/ || true
      shell: bash

    - run: mkdir -p /home/runner/.docker
      shell: bash

    - name: Log in
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 #v2.0
      with:
        username: ${{ inputs.registry-user }}
        password: ${{ inputs.registry-password }}
        registry: "docker.io"
        # Use runner temp to be compatible with both GitHub-hosted and self-hosted runners.
        auth_file_path: ${{ runner.temp }}/docker-config.json

    - name: buildah build
      id: build-image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 #v3.1.0
      with:
        image: ${{ inputs.registry }}/${{ inputs.image-name }}
        tags: ${{ inputs.image-tags }}
        context: ${{ inputs.context }}
        containerfiles: |
          ${{ inputs.containerfile != '' && inputs.containerfile || format('./{0}/Dockerfile', inputs.image-name) }}
        build-args: |
          VCS_REF=${{ github.sha }}
          BUILD_DATE=${{ steps.vars.outputs.BUILD_DATE }}
          REGISTRY_PATH=${{ inputs.registry }}
          ${{ inputs.build-args }}
        extra-args: |
          --format=docker
          ${{ inputs.build-opts }}

    # push-to-registry v3.0.0 dropped the separate image/registry inputs and takes
    # one full reference per tag, so build the references here.
    #
    # buildah-build echoes back whatever shape `image-tags` was given: a caller that
    # passes a bare tag (base-bin.yml) gets `bookworm` here, one that passes a full
    # reference (both ci-unified workflows) gets `docker.io/paritytech/ci-unified:bookworm`.
    # Prefixing unconditionally doubled the name on the latter —
    # `docker.io/paritytech/ci-unified:docker.io/paritytech/ci-unified:bookworm` —
    # and every push failed with "invalid reference format".
    - name: Prepare tags
      id: push-tags
      if: ${{ inputs.push }}
      shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}
        TAGS: ${{ steps.build-image.outputs.tags }}
      run: |
        out=""
        for tag in $TAGS; do
          case "$tag" in
            "$IMAGE":*) out="$out $tag" ;;
            *)          out="$out $IMAGE:$tag" ;;
          esac
        done
        echo "tags=${out# }" >> $GITHUB_OUTPUT

    - name: push
      id: push-image
      if: ${{ inputs.push }}
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 #v3.0.0
      with:
        tags: ${{ steps.push-tags.outputs.tags }}

    - name: Print image url
      shell: bash
      if: ${{ inputs.push }}
      run: |
        echo "Image pushed to ${{ steps.push-image.outputs.registry-paths }}"
        echo "Image pushed to ${{ steps.push-image.outputs.registry-paths }}" >> $GITHUB_STEP_SUMMARY
